services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./application/shared/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: application/Dockerfile.api
    environment:
      APP_NAME: production-cloud-reliability-platform
      ENVIRONMENT: local
      SERVICE_NAME: api
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://platform:platform@postgres:5432/platform
      LOCAL_ARTIFACT_ROOT: /app/platform-artifacts
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - artifacts:/app/platform-artifacts
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\""]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: application/Dockerfile.worker
    environment:
      ENVIRONMENT: local
      SERVICE_NAME: worker
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://platform:platform@postgres:5432/platform
      LOCAL_ARTIFACT_ROOT: /app/platform-artifacts
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - artifacts:/app/platform-artifacts

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./application/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  artifacts:

