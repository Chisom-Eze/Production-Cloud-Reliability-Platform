map $http_x_request_id $proxy_request_id {
    default $http_x_request_id;
    "" $request_id;
}

map $http_x_correlation_id $proxy_correlation_id {
    default $http_x_correlation_id;
    "" $proxy_request_id;
}

log_format structured escape=json
  '{"timestamp":"$time_iso8601",'
  '"service":"nginx",'
  '"request_id":"$proxy_request_id",'
  '"correlation_id":"$proxy_correlation_id",'
  '"method":"$request_method",'
  '"path":"$uri",'
  '"status_code":$status,'
  '"request_time_seconds":$request_time,'
  '"upstream_status":"$upstream_status",'
  '"upstream_response_time":"$upstream_response_time"}';

server {
    listen 8080;
    server_name _;

    access_log /var/log/nginx/access.log structured;
    error_log /var/log/nginx/error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $proxy_request_id;
        proxy_set_header X-Correlation-ID $proxy_correlation_id;
    }
}
