name: Terraform Development Plan

on:
  workflow_dispatch:
    inputs:
      root:
        description: "Approved Terraform root to plan."
        required: true
        type: choice
        options:
          - shared/container-registry
          - shared/dns
          - shared/security-audit
          - environments/development

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-plan-development-${{ inputs.root }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    environment: development-plan

    env:
      AWS_REGION: us-east-1
      TERRAFORM_PLAN_ROLE_ARN: ${{ vars.AWS_DEVELOPMENT_TERRAFORM_PLAN_ROLE_ARN }}
      TERRAFORM_PLAN_ROLE_NAME: pcrp-GitHubDevelopmentTerraformPlan
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_STATE_BUCKET: pcrp-terraform-state-us-east-1
      TF_VERSION: "1.10.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Resolve approved Terraform root
        id: resolve-root
        env:
          SELECTED_ROOT: ${{ inputs.root }}
        run: |
          set -euo pipefail

          case "${SELECTED_ROOT}" in
            shared/container-registry)
              tf_root="infrastructure/shared/container-registry"
              state_key="shared/container-registry/terraform.tfstate"
              root_slug="container-registry"
              ;;
            shared/dns)
              tf_root="infrastructure/shared/dns"
              state_key="shared/dns/terraform.tfstate"
              root_slug="dns"
              ;;
            shared/security-audit)
              tf_root="infrastructure/shared/security-audit"
              state_key="shared/security-audit/terraform.tfstate"
              root_slug="security-audit"
              ;;
            environments/development)
              tf_root="infrastructure/environments/development"
              state_key="environments/development/terraform.tfstate"
              root_slug="development"
              ;;
            *)
              echo "::error::Unsupported Terraform root."
              exit 1
              ;;
          esac

          {
            echo "TF_LOGICAL_ROOT=${SELECTED_ROOT}"
            echo "TF_ROOT=${tf_root}"
            echo "TF_STATE_KEY=${state_key}"
            echo "TF_ROOT_SLUG=${root_slug}"
          } >> "${GITHUB_ENV}"

          {
            echo "logical_root=${SELECTED_ROOT}"
            echo "tf_root=${tf_root}"
            echo "state_key=${state_key}"
            echo "root_slug=${root_slug}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate and supply development Terraform inputs
        if: ${{ inputs.root == 'environments/development' }}
        env:
          TF_VAR_application_domain_name: ${{ vars.APPLICATION_DOMAIN_NAME }}
          TF_VAR_route53_zone_id: ${{ vars.ROUTE53_ZONE_ID }}
          TF_VAR_api_image_uri: ${{ vars.API_IMAGE_URI }}
          TF_VAR_worker_image_uri: ${{ vars.WORKER_IMAGE_URI }}
          TF_VAR_nginx_image_uri: ${{ vars.NGINX_IMAGE_URI }}
          TF_VAR_adot_collector_image_uri: ${{ vars.ADOT_COLLECTOR_IMAGE_URI }}
          TF_VAR_waf_common_rule_set_version: ${{ vars.WAF_COMMON_RULE_SET_VERSION }}
          TF_VAR_waf_known_bad_inputs_rule_set_version: ${{ vars.WAF_KNOWN_BAD_INPUTS_RULE_SET_VERSION }}
          TF_VAR_waf_sqli_rule_set_version: ${{ vars.WAF_SQLI_RULE_SET_VERSION }}
          TF_VAR_worker_backlog_per_task_target: ${{ vars.WORKER_BACKLOG_PER_TASK_TARGET }}
          TF_VAR_api_5xx_error_rate_alarm_percent: ${{ vars.API_5XX_ERROR_RATE_ALARM_PERCENT }}
          TF_VAR_api_p95_latency_alarm_seconds: ${{ vars.API_P95_LATENCY_ALARM_SECONDS }}
          TF_VAR_queue_oldest_message_age_alarm_seconds: ${{ vars.QUEUE_OLDEST_MESSAGE_AGE_ALARM_SECONDS }}
          TF_VAR_rds_cpu_alarm_percent: ${{ vars.RDS_CPU_ALARM_PERCENT }}
          TF_VAR_rds_free_storage_alarm_bytes: ${{ vars.RDS_FREE_STORAGE_ALARM_BYTES }}
        run: |
          set -euo pipefail

          validation_errors=0

          require_value() {
            local github_variable="$1"
            local value="$2"

            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "::error::Set GitHub Environment variable ${github_variable} in development-plan."
              validation_errors=$((validation_errors + 1))
            elif [[ "${value}" == *$'\n'* || "${value}" == *$'\r'* ]]; then
              echo "::error::GitHub Environment variable ${github_variable} must be a single-line value."
              validation_errors=$((validation_errors + 1))
            fi
          }

          validate_image() {
            local github_variable="$1"
            local value="$2"

            if [[ -n "${value}" && ( ! "${value}" =~ ^.+@sha256:[0-9a-f]{64}$ || "${value}" == *":latest@"* ) ]]; then
              echo "::error::GitHub Environment variable ${github_variable} must use repository@sha256:<64 lowercase hex> and must not use :latest."
              validation_errors=$((validation_errors + 1))
            fi
          }

          require_value APPLICATION_DOMAIN_NAME "${TF_VAR_application_domain_name:-}"
          require_value ROUTE53_ZONE_ID "${TF_VAR_route53_zone_id:-}"
          require_value API_IMAGE_URI "${TF_VAR_api_image_uri:-}"
          require_value WORKER_IMAGE_URI "${TF_VAR_worker_image_uri:-}"
          require_value NGINX_IMAGE_URI "${TF_VAR_nginx_image_uri:-}"
          require_value ADOT_COLLECTOR_IMAGE_URI "${TF_VAR_adot_collector_image_uri:-}"
          require_value WAF_COMMON_RULE_SET_VERSION "${TF_VAR_waf_common_rule_set_version:-}"
          require_value WAF_KNOWN_BAD_INPUTS_RULE_SET_VERSION "${TF_VAR_waf_known_bad_inputs_rule_set_version:-}"
          require_value WAF_SQLI_RULE_SET_VERSION "${TF_VAR_waf_sqli_rule_set_version:-}"
          require_value WORKER_BACKLOG_PER_TASK_TARGET "${TF_VAR_worker_backlog_per_task_target:-}"
          require_value API_5XX_ERROR_RATE_ALARM_PERCENT "${TF_VAR_api_5xx_error_rate_alarm_percent:-}"
          require_value API_P95_LATENCY_ALARM_SECONDS "${TF_VAR_api_p95_latency_alarm_seconds:-}"
          require_value QUEUE_OLDEST_MESSAGE_AGE_ALARM_SECONDS "${TF_VAR_queue_oldest_message_age_alarm_seconds:-}"
          require_value RDS_CPU_ALARM_PERCENT "${TF_VAR_rds_cpu_alarm_percent:-}"
          require_value RDS_FREE_STORAGE_ALARM_BYTES "${TF_VAR_rds_free_storage_alarm_bytes:-}"

          validate_image API_IMAGE_URI "${TF_VAR_api_image_uri:-}"
          validate_image WORKER_IMAGE_URI "${TF_VAR_worker_image_uri:-}"
          validate_image NGINX_IMAGE_URI "${TF_VAR_nginx_image_uri:-}"
          validate_image ADOT_COLLECTOR_IMAGE_URI "${TF_VAR_adot_collector_image_uri:-}"

          if (( validation_errors > 0 )); then
            exit 1
          fi

          printf '%s\n' \
            "TF_VAR_application_domain_name=${TF_VAR_application_domain_name}" \
            "TF_VAR_route53_zone_id=${TF_VAR_route53_zone_id}" \
            "TF_VAR_api_image_uri=${TF_VAR_api_image_uri}" \
            "TF_VAR_worker_image_uri=${TF_VAR_worker_image_uri}" \
            "TF_VAR_nginx_image_uri=${TF_VAR_nginx_image_uri}" \
            "TF_VAR_adot_collector_image_uri=${TF_VAR_adot_collector_image_uri}" \
            "TF_VAR_waf_common_rule_set_version=${TF_VAR_waf_common_rule_set_version}" \
            "TF_VAR_waf_known_bad_inputs_rule_set_version=${TF_VAR_waf_known_bad_inputs_rule_set_version}" \
            "TF_VAR_waf_sqli_rule_set_version=${TF_VAR_waf_sqli_rule_set_version}" \
            "TF_VAR_worker_backlog_per_task_target=${TF_VAR_worker_backlog_per_task_target}" \
            "TF_VAR_api_5xx_error_rate_alarm_percent=${TF_VAR_api_5xx_error_rate_alarm_percent}" \
            "TF_VAR_api_p95_latency_alarm_seconds=${TF_VAR_api_p95_latency_alarm_seconds}" \
            "TF_VAR_queue_oldest_message_age_alarm_seconds=${TF_VAR_queue_oldest_message_age_alarm_seconds}" \
            "TF_VAR_rds_cpu_alarm_percent=${TF_VAR_rds_cpu_alarm_percent}" \
            "TF_VAR_rds_free_storage_alarm_bytes=${TF_VAR_rds_free_storage_alarm_bytes}" \
            "TF_VAR_ecs_services_enabled=false" >> "${GITHUB_ENV}"

      - name: Confirm Terraform plan role configuration
        run: |
          if [[ -z "${TERRAFORM_PLAN_ROLE_ARN}" ]]; then
            echo "::error::Set the development-plan environment variable AWS_DEVELOPMENT_TERRAFORM_PLAN_ROLE_ARN."
            exit 1
          fi

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.TERRAFORM_PLAN_ROLE_ARN }}
          role-session-name: terraform-plan-${{ github.run_id }}

      - name: Check Terraform formatting
        run: terraform -chdir="${TF_ROOT}" fmt -check

      - name: Initialize selected Terraform backend
        run: |
          terraform -chdir="${TF_ROOT}" init \
            -input=false \
            -lockfile=readonly \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate selected Terraform root
        run: terraform -chdir="${TF_ROOT}" validate -no-color

      - name: Create exact Terraform binary plan
        id: terraform-plan
        run: |
          set -euo pipefail

          set +e
          terraform -chdir="${TF_ROOT}" plan \
            -input=false \
            -no-color \
            -detailed-exitcode \
            -out=tfplan
          plan_exit_code=$?
          set -e

          case "${plan_exit_code}" in
            0)
              plan_result="no changes"
              ;;
            2)
              plan_result="changes detected"
              ;;
            *)
              echo "::error::Terraform plan failed with exit code ${plan_exit_code}."
              exit "${plan_exit_code}"
              ;;
          esac

          echo "plan_result=${plan_result}" >> "${GITHUB_OUTPUT}"

      - name: Create plan metadata
        id: plan-metadata
        env:
          PLAN_RESULT: ${{ steps.terraform-plan.outputs.plan_result }}
        run: |
          set -euo pipefail

          plan_file="${TF_ROOT}/tfplan"
          metadata_file="${TF_ROOT}/plan-metadata.json"
          artifact_name="terraform-plan-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}-${TF_ROOT_SLUG}"
          plan_sha256="$(sha256sum "${plan_file}" | awk '{print $1}')"

          jq -n \
            --argjson schema_version 1 \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg workflow_name "${GITHUB_WORKFLOW}" \
            --arg workflow_run_id "${GITHUB_RUN_ID}" \
            --arg workflow_run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg source_git_sha "${GITHUB_SHA}" \
            --arg source_ref "${GITHUB_REF}" \
            --arg root "${TF_LOGICAL_ROOT}" \
            --arg terraform_root "${TF_ROOT}" \
            --arg backend_state_key "${TF_STATE_KEY}" \
            --arg aws_region "${AWS_REGION}" \
            --arg terraform_version "${TF_VERSION}" \
            --arg plan_result "${PLAN_RESULT}" \
            --arg tfplan_sha256 "${plan_sha256}" \
            '{
              schema_version: $schema_version,
              repository: $repository,
              workflow_name: $workflow_name,
              workflow_run_id: $workflow_run_id,
              workflow_run_attempt: $workflow_run_attempt,
              source_git_sha: $source_git_sha,
              source_ref: $source_ref,
              root: $root,
              terraform_root: $terraform_root,
              backend_state_key: $backend_state_key,
              aws_region: $aws_region,
              terraform_version: $terraform_version,
              plan_result: $plan_result,
              tfplan_sha256: $tfplan_sha256
            }' > "${metadata_file}"

          {
            echo "artifact_name=${artifact_name}"
            echo "plan_sha256=${plan_sha256}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload immutable Terraform plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plan-metadata.outputs.artifact_name }}
          path: |
            ${{ steps.resolve-root.outputs.tf_root }}/tfplan
            ${{ steps.resolve-root.outputs.tf_root }}/plan-metadata.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7

      - name: Write Terraform plan summary
        env:
          ARTIFACT_NAME: ${{ steps.plan-metadata.outputs.artifact_name }}
          PLAN_RESULT: ${{ steps.terraform-plan.outputs.plan_result }}
          PLAN_SHA256: ${{ steps.plan-metadata.outputs.plan_sha256 }}
        run: |
          {
            echo "## Terraform Development Plan"
            echo ""
            echo "- Selected root: ${TF_LOGICAL_ROOT}"
            echo "- Plan run ID: ${GITHUB_RUN_ID}"
            echo "- Plan run attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "- Source SHA: ${GITHUB_SHA}"
            echo "- Backend state key: ${TF_STATE_KEY}"
            echo "- Plan identity: ${TERRAFORM_PLAN_ROLE_NAME}"
            echo "- Plan result: ${PLAN_RESULT}"
            echo "- Artifact: ${ARTIFACT_NAME}"
            echo "- Plan SHA-256: ${PLAN_SHA256}"
          } >> "${GITHUB_STEP_SUMMARY}"
