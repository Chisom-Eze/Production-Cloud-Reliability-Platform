name: Bootstrap IAM Transition

# TEMPORARY WORKFLOW:
# Use only for the one-time bootstrap IAM transition that provisions the
# permanent Terraform plan role. Remove this workflow after the plan role is
# provisioned and verified. Normal development deployment must not use this
# bridge workflow.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Run an authenticated bootstrap plan or apply the saved bootstrap IAM transition plan."
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
      confirmation:
        description: "Required only for apply. Must exactly equal APPLY-BOOTSTRAP-IAM."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: bootstrap-iam-transition
  cancel-in-progress: false

jobs:
  bootstrap-iam-transition:
    name: Bootstrap IAM transition
    runs-on: ubuntu-latest
    environment: development

    defaults:
      run:
        working-directory: infrastructure/bootstrap

    env:
      AWS_REGION: us-east-1
      BOOTSTRAP_TRANSITION_ROLE_ARN: ${{ vars.AWS_DEVELOPMENT_DEPLOYMENT_ROLE_ARN }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_STATE_BUCKET: pcrp-terraform-state-us-east-1
      TF_STATE_KEY: bootstrap/terraform.tfstate
      TF_VAR_state_bucket_name: pcrp-terraform-state-us-east-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Confirm transition role configuration
        run: |
          if [[ -z "${BOOTSTRAP_TRANSITION_ROLE_ARN}" ]]; then
            echo "::error::Set the development environment variable AWS_DEVELOPMENT_DEPLOYMENT_ROLE_ARN to the proven bootstrap transition role ARN."
            exit 1
          fi

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.BOOTSTRAP_TRANSITION_ROLE_ARN }}
          role-session-name: bootstrap-iam-transition-${{ github.run_id }}

      - name: Validate bootstrap apply confirmation
        if: ${{ inputs.action == 'apply' }}
        run: |
          if [[ "${{ inputs.confirmation }}" != "APPLY-BOOTSTRAP-IAM" ]]; then
            echo "::error::Bootstrap apply requires confirmation value APPLY-BOOTSTRAP-IAM."
            exit 1
          fi

      - name: Initialize bootstrap remote backend
        run: |
          if [[ -f backend.s3.tfbackend ]]; then
            terraform init -input=false -backend-config=backend.s3.tfbackend
          else
            terraform init \
              -input=false \
              -backend-config="bucket=${TF_STATE_BUCKET}" \
              -backend-config="key=${TF_STATE_KEY}" \
              -backend-config="region=${AWS_REGION}" \
              -backend-config="encrypt=true" \
              -backend-config="use_lockfile=true"
          fi

      - name: Inspect bootstrap state
        if: ${{ inputs.action == 'repair-state' }}
        working-directory: infrastructure/bootstrap
        shell: bash
        run: |
          set -euo pipefail

          echo "Current bootstrap state:"
          terraform state list

          if terraform state list | grep -Fxq 'aws_s3_bucket.terraform_state'; then
            echo "aws_s3_bucket.terraform_state is already present."
            exit 0
          fi

          echo "aws_s3_bucket.terraform_state is missing."
          echo "Importing the existing state bucket into remote Terraform state."

          terraform import \
            -input=false \
            aws_s3_bucket.terraform_state \
            pcrp-terraform-state-us-east-1

          echo
          echo "State after repair:"
          terraform state list

      - name: Validate bootstrap configuration
        run: terraform validate -no-color

      - name: Create bootstrap transition plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply exact bootstrap transition plan
        if: ${{ inputs.action == 'apply' }}
        run: terraform apply -input=false -no-color tfplan
