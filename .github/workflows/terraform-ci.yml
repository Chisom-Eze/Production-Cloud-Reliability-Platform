name: Terraform Static Quality Gates

on:
  pull_request:
    branches:
      - main
    paths:
      - "infrastructure/**"
      - ".tflint.hcl"
      - ".github/workflows/terraform-ci.yml"
      - "scripts/terraform-quality.sh"
      - "docs/operations/terraform-ci.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  terraform-static-quality:
    name: Terraform static quality
    runs-on: ubuntu-latest

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.73.0

      - name: Run Terraform static quality gates
        run: bash scripts/terraform-quality.sh
