name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-checks:
    name: Python lint and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx ruff

      - name: Lint Python
        run: |
          ruff check application tests

      - name: Run pytest
        run: |
          pytest

  container-checks:
    name: Docker and Nginx checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build containers
        run: docker compose build

      - name: Start application dependencies
        run: |
          docker compose up -d postgres api
          docker compose ps

      - name: Validate Nginx configuration
        run: |
          docker compose run --rm --no-deps nginx nginx -t

      - name: Start full application stack
        run: |
          docker compose up -d
          docker compose ps

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8080/health > /dev/null; then
              echo "Application is healthy"
              exit 0
            fi

            echo "Waiting for application... attempt $i/30"
            sleep 2
          done

          echo "Application failed to become healthy"
          exit 1

      - name: Run smoke tests
        run: |
          curl --fail --show-error http://localhost:8080/health
          curl --fail --show-error http://localhost:8080/ready

      - name: Collect container diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color nginx || true
          docker compose logs --no-color api || true
          docker compose logs --no-color postgres || true
          docker compose logs --no-color worker || true

      - name: Stop test environment
        if: always()
        run: docker compose down -v