name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-checks:
    name: Python lint and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx ruff

      - name: Lint Python
        run: |
          ruff check application tests

      - name: Run pytest
        run: |
          pytest

  container-checks:
    name: Docker and Nginx checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: |
          docker compose config

      - name: Build API Docker image
        run: |
          docker build -f application/Dockerfile.api -t production-cloud-reliability-platform-api:ci .

      - name: Build worker Docker image
        run: |
          docker build -f application/Dockerfile.worker -t production-cloud-reliability-platform-worker:ci .

      - name: Validate Nginx configuration
        run: |
          docker run --rm \
            -v "$PWD/application/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

