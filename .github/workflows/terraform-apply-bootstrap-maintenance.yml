name: Terraform Bootstrap IAM Maintenance Apply

# TEMPORARY: consume only the separately reviewed saved bootstrap Plan.
on:
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: "Approved bootstrap Plan run ID."
        required: true
        type: string
      plan_run_attempt:
        description: "Exact approved Plan run attempt."
        required: true
        type: string
      plan_sha256:
        description: "SHA-256 copied from the reviewed Plan summary."
        required: true
        type: string
      confirmation:
        description: "Must equal APPLY-BOOTSTRAP-IAM."
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: terraform-bootstrap-iam-maintenance
  cancel-in-progress: false

jobs:
  terraform-apply:
    name: Bootstrap IAM maintenance apply
    runs-on: ubuntu-latest
    environment: development
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "964117916184"
      BOOTSTRAP_TRANSITION_ROLE_ARN: ${{ vars.AWS_DEVELOPMENT_DEPLOYMENT_ROLE_ARN }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VERSION: "1.10.0"
      TF_ROOT: infrastructure/bootstrap
      TF_STATE_BUCKET: pcrp-terraform-state-us-east-1
      TF_STATE_KEY: bootstrap/terraform.tfstate
      TF_VAR_state_bucket_name: pcrp-terraform-state-us-east-1
      PLAN_WORKFLOW_NAME: Terraform Bootstrap IAM Maintenance Plan
      PLAN_WORKFLOW_PATH: .github/workflows/terraform-plan-bootstrap-maintenance.yml
      PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      PLAN_RUN_ATTEMPT: ${{ inputs.plan_run_attempt }}
      APPROVED_PLAN_SHA256: ${{ inputs.plan_sha256 }}
      APPLY_CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Validate manual approval and bridge configuration
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$APPLY_CONFIRMATION" == APPLY-BOOTSTRAP-IAM ]]
          [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$PLAN_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$APPROVED_PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BOOTSTRAP_TRANSITION_ROLE_ARN" == "arn:aws:iam::${AWS_ACCOUNT_ID}:role/ProductionCloudReliabilityPlatform-GitHubDevelopmentDeployment" ]]
          echo "PLAN_ARTIFACT_NAME=terraform-plan-${PLAN_RUN_ID}-attempt-${PLAN_RUN_ATTEMPT}-bootstrap-iam" >> "$GITHUB_ENV"

      - name: Verify exact successful Plan provenance and current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api() {
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' "$1"
          }
          base="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          run_json="$RUNNER_TEMP/bootstrap-plan-run.json"
          api "$base/actions/runs/$PLAN_RUN_ID/attempts/$PLAN_RUN_ATTEMPT" > "$run_json"
          jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg id "$PLAN_RUN_ID" \
            --arg attempt "$PLAN_RUN_ATTEMPT" \
            --arg name "$PLAN_WORKFLOW_NAME" \
            --arg path "$PLAN_WORKFLOW_PATH" \
            --arg sha "$GITHUB_SHA" \
            '(.id|tostring)==$id and (.run_attempt|tostring)==$attempt
              and .repository.full_name==$repo and .head_repository.full_name==$repo
              and .name==$name and .path==$path and .status=="completed"
              and .conclusion=="success" and .event=="workflow_dispatch"
              and .head_branch=="main" and .head_sha==$sha' "$run_json" > /dev/null
          main_sha="$(api "$base/git/ref/heads/main" | jq -er '.object.sha')"
          [[ "$main_sha" == "$GITHUB_SHA" ]]

      - name: Checkout exact approved Plan source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download exact approved Plan artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PLAN_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/approved-bootstrap-plan
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.plan_run_id }}

      - name: Verify metadata and operator-approved Plan digest
        run: |
          set -euo pipefail
          plan_dir="$RUNNER_TEMP/approved-bootstrap-plan"
          [[ -f "$plan_dir/tfplan" && -f "$plan_dir/plan-metadata.json" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          actual_digest="$(sha256sum "$plan_dir/tfplan" | awk '{print $1}')"
          [[ "$actual_digest" == "$APPROVED_PLAN_SHA256" ]]
          jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg name "$PLAN_WORKFLOW_NAME" \
            --arg id "$PLAN_RUN_ID" \
            --arg attempt "$PLAN_RUN_ATTEMPT" \
            --arg sha "$GITHUB_SHA" \
            --arg root "$TF_ROOT" \
            --arg bucket "$TF_STATE_BUCKET" \
            --arg key "$TF_STATE_KEY" \
            --arg region "$AWS_REGION" \
            --arg account "$AWS_ACCOUNT_ID" \
            --arg version "$TF_VERSION" \
            --arg digest "$actual_digest" \
            '.schema_version==1 and .scope=="bootstrap-iam-remediation"
              and .repository==$repo and .workflow_name==$name
              and (.workflow_run_id|tostring)==$id and (.workflow_run_attempt|tostring)==$attempt
              and .source_git_sha==$sha and .source_ref=="refs/heads/main"
              and .terraform_root==$root and .backend_bucket==$bucket and .backend_state_key==$key
              and .aws_region==$region and .aws_account_id==$account and .terraform_version==$version
              and .plan_result=="changes detected" and .tfplan_sha256==$digest' \
            "$plan_dir/plan-metadata.json" > /dev/null

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.BOOTSTRAP_TRANSITION_ROLE_ARN }}
          role-session-name: bootstrap-apply-${{ github.run_id }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Initialize verified bootstrap backend
        run: |
          set -euo pipefail
          terraform -chdir="$TF_ROOT" init \
            -input=false -reconfigure -lockfile=readonly \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Revalidate approved plan allowlist and apply exact binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          plan_file="$RUNNER_TEMP/approved-bootstrap-plan/tfplan"
          [[ "$(sha256sum "$plan_file" | awk '{print $1}')" == "$APPROVED_PLAN_SHA256" ]]
          terraform -chdir="$TF_ROOT" show -json "$plan_file" \
            | python3 .github/scripts/validate-bootstrap-iam-plan.py "$AWS_ACCOUNT_ID"
          main_sha="$(curl --fail-with-body --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -er '.object.sha')"
          [[ "$main_sha" == "$GITHUB_SHA" ]]
          terraform -chdir="$TF_ROOT" apply -input=false -no-color "$plan_file"

      - name: Record bootstrap Apply evidence
        if: ${{ success() }}
        run: |
          {
            echo '## Bootstrap IAM maintenance Apply'
            echo "- Source SHA: $GITHUB_SHA"
            echo "- Approved Plan run ID: $PLAN_RUN_ID"
            echo "- Approved Plan attempt: $PLAN_RUN_ATTEMPT"
            echo "- Approved Plan digest: $APPROVED_PLAN_SHA256"
            echo '- Result: successful exact saved-plan apply.'
          } >> "$GITHUB_STEP_SUMMARY"
