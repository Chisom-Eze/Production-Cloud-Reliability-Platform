[project]
name = "aws-production-cloud-reliability-platform"
version = "0.1.0"
description = "Local application foundation for an AWS production reliability platform."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "email-validator>=2.1.0",
    "fastapi>=0.110.0",
    "prometheus-client>=0.20.0",
    "psycopg[binary,pool]>=3.1.18",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
